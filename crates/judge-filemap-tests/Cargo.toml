[package]
name = "chrono-judge-filemap-tests"
version = "0.1.0"
edition = "2024"
publish = false
autotests = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
json-patch = { version = "5", default-features = false }
verus_builtin_macros = "=0.0.0-2026-04-20-1748"
chrono-judge-filemap = { path = "../judge-filemap" }
tempfile = "3"

[[test]]
name = "impact"
path = "tests/impact.rs"

[[test]]
name = "verified_graph"
path = "tests/verified_graph.rs"

[[bin]]
name = "chrono-test-mixed"
path = "tests/support/mixed.rs"
test = false
bench = false

[[bin]]
name = "chrono-test-registration"
path = "tests/support/registration.rs"
test = false
bench = false

[[bin]]
name = "chrono-test-filemap-runner"
path = "tests/support/runner.rs"
test = false
bench = false

[[example]]
name = "release_observation"
path = "tests/verified_graph.rs"
