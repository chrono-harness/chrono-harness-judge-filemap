[package]
name = "chrono-judge-filemap-tests"
version = "0.1.0"
edition = "2024"
publish = false
autotests = false

[dependencies]
chrono-test-git = { git = "https://github.com/chrono-harness/chrono-harness-test-git.git", rev = "52c7a2fa2a3a43fcfcf41ae104a77c6ed4c458b5" }

[dev-dependencies]
chrono-harness = { git = "https://github.com/chrono-harness/chrono-harness-runner.git", rev = "a1cff08f74d996d618372f20adc203d1b5904d50" }
chrono-registration-fixture = { git = "https://github.com/chrono-harness/chrono-harness-judge-registration.git", rev = "76530cce04ad04ebda2f71a16a8a51f930c2daa8" }
chrono-judge-registration = { git = "https://github.com/chrono-harness/chrono-harness-judge-registration.git", rev = "76530cce04ad04ebda2f71a16a8a51f930c2daa8" }
chrono-test-process = { git = "https://github.com/chrono-harness/chrono-harness-runner.git", rev = "a1cff08f74d996d618372f20adc203d1b5904d50" }
chrono-judge-filemap = { path = "../judge-filemap" }
serde_json = "1"
tempfile = "3"

[[bin]]
name = "chrono-test-git-model"
path = "tests/support/model.rs"
test = false
bench = false

[[test]]
name = "impact"
path = "tests/impact.rs"

[[test]]
name = "verified_graph"
path = "tests/verified_graph.rs"
