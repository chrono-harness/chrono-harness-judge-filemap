[package]
name = "chrono-judge-filemap-tests"
version = "0.1.0"
edition = "2024"
publish = false
autotests = false

[dependencies]
chrono-judge-filemap = { path = "../judge-filemap" }
vstd = "=0.0.0-2026-11-22-0344"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
toml = "0.9"
verus_builtin_macros = "=0.0.0-2026-11-22-0344"
sha2 = "0.11"
serde_yaml = { package = "serde_yaml_ng", version = "=0.10.0" }
json-patch = { version = "5", default-features = false }
tempfile = "3"

[[test]]
name = "impact"
path = "tests/impact.rs"

[[test]]
name = "verified_graph"
path = "tests/verified_graph.rs"

[[bin]]
name = "chrono-test-mixed"
path = "tests/support/mixed.rs"
test = false
bench = false

[[bin]]
name = "chrono-test-registration"
path = "tests/support/registration.rs"
test = false
bench = false

[[bin]]
name = "chrono-test-filemap-runner"
path = "tests/support/runner.rs"
test = false
bench = false

[[example]]
name = "release_observation"
path = "tests/verified_graph.rs"
