[package]
name = "chrono-judge-filemap-tests"
version = "0.1.0"
edition = "2024"
publish = false
autotests = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
json-patch = { version = "4", default-features = false }
chrono-harness = { git = "https://github.com/chrono-harness/chrono-harness-runner.git", rev = "a1cff08f74d996d618372f20adc203d1b5904d50" }
chrono-test-process = { git = "https://github.com/chrono-harness/chrono-harness-runner.git", rev = "a1cff08f74d996d618372f20adc203d1b5904d50" }
chrono-judge-filemap = { path = "../judge-filemap" }
tempfile = "3"

[[test]]
name = "impact"
path = "tests/impact.rs"

[[test]]
name = "verified_graph"
path = "tests/verified_graph.rs"

[[bin]]
name = "chrono-test-mixed"
path = "tests/support/mixed.rs"
test = false
bench = false

[[bin]]
name = "chrono-test-registration"
path = "tests/support/registration.rs"
test = false
bench = false
