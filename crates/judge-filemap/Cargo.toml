[package]
name = "chrono-judge-filemap"
version = "0.1.8"
edition = "2024"
publish = false

[lib]
test = false
doctest = false

[[bin]]
name = "chrono-judge-filemap"
path = "src/main.rs"
test = false
bench = false

[dependencies]
hex = "0.4"
digest-io = "0.1"
serde_yaml_ng = "=0.10.0"
litrs = "=1.0.1"
vstd = "=0.0.0-2026-11-22-0344"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"

# Independent judge roots also compile the shared evidence consumers.
[profile.dev]
opt-level = 1
debug-assertions = true
overflow-checks = true

[profile.dev.package.sha2]
opt-level = 3
